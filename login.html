<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="brand">
        <img src="images/logo.png?v=DEPLOYHASH" alt="GlamEye" class="brand-logo" width="160" height="36" />
      </a>
      <nav class="site-nav"><a href="/">Back to Shop</a></nav>
    </div>
  </header>
  <main class="container" style="padding: 4rem 1rem;">
    <div class="form-card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to manage your orders and wishlist</p>
      <p id="oauth-error" class="form-feedback error" style="display:none;"></p>
      <div id="social-login" class="form-group" style="display:none; flex-direction:column; margin-bottom:1.5rem; gap:.85rem;">
        <a href="api/oauth/google.php" id="btn-google" class="oauth-btn oauth-btn-google" style="display:none;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
            <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
            <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
          </svg>
          <span>Continue with Google</span>
        </a>
        <a href="api/oauth/tiktok.php" id="btn-tiktok" class="oauth-btn oauth-btn-tiktok" style="display:none;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
            <path fill="#25F4EE" d="M19.59 9.39v4.91A14.18 14.18 0 0 0 27 16.05v4.93a18.97 18.97 0 0 1-7.41-1.62v10.31A8.33 8.33 0 1 1 11.26 21.34v5.05a3.28 3.28 0 1 0 3.28 3.28V9.39z"/>
            <path fill="#FE2C55" d="M22.59 6.39v4.91A14.18 14.18 0 0 0 30 13.05v4.93a18.97 18.97 0 0 1-7.41-1.62v10.31A8.33 8.33 0 1 1 14.26 18.34v5.05a3.28 3.28 0 1 0 3.28 3.28V6.39z"/>
            <path fill="#FFF" d="M20.59 7.89v4.91A14.18 14.18 0 0 0 28 14.55v4.93a18.97 18.97 0 0 1-7.41-1.62v10.31A8.33 8.33 0 1 1 12.26 19.84v5.05a3.28 3.28 0 1 0 3.28 3.28V7.89z"/>
          </svg>
          <span>Continue with TikTok</span>
        </a>
      </div>
      <div id="social-divider" class="divider" style="display:none;">OR</div>
      <form id="login-form" class="form-group">
        <label>
          <span class="label-text">Email</span>
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>
          <span class="label-text">Password
            <a href="/forgot-password.html" style="float:right;font-size:.8rem;color:var(--gold);text-decoration:none;">Forgot?</a>
          </span>
          <input type="password" name="password" required autocomplete="current-password" minlength="8" />
        </label>
        <button type="submit" class="button button-primary button-block">Sign In</button>
        <p id="login-feedback" class="form-feedback"></p>
      </form>
      <div class="divider">OR</div>
      <p class="text-center muted small">
        New to GlamEye? <a href="signup.html" id="signup-link">Create an account</a>
      </p>
    </div>
  </main>
  <script src="js/app.js?v=DEPLOYHASH"></script>
  <script>
    // OAuth error from query (?error=...)
    const params = new URLSearchParams(location.search);
    if (params.get('error')) {
      const eEl = document.getElementById('oauth-error');
      eEl.textContent = '⚠ ' + params.get('error');
      eEl.style.display = 'block';
    }
    // 把 ?redirect=… 也透传给 Sign-up 链接(checkout 跳过来时,用户点 Create account 也应跳回 checkout)
    const redirectParam = params.get('redirect');
    if (redirectParam) {
      const signupLink = document.getElementById('signup-link');
      if (signupLink) signupLink.href = 'signup.html?redirect=' + encodeURIComponent(redirectParam);
      // 顶部加一个友好 banner 解释为什么需要登录
      const fb = document.getElementById('login-feedback');
      if (fb && (redirectParam.indexOf('/checkout') === 0 || redirectParam.indexOf('checkout') > -1)) {
        const banner = document.createElement('p');
        banner.className = 'form-feedback';
        banner.style.cssText = 'background:rgba(184,146,78,.12);border-left:3px solid var(--gold);padding:.75rem 1rem;border-radius:6px;margin-bottom:1rem;';
        banner.innerHTML = '🛒 Sign in to complete your purchase. New here? <a href="' + 'signup.html?redirect=' + encodeURIComponent(redirectParam) + '" style="color:var(--gold);">Create an account</a> — your cart is saved.';
        fb.parentNode.insertBefore(banner, fb.parentNode.firstChild);
      }
    }
    // Show social login buttons only if configured
    fetch('api/settings.php').then(r => r.json()).then(s => {
      let any = false;
      if (s.oauth_google_enabled === '1') {
        document.getElementById('btn-google').style.display = 'inline-flex';
        any = true;
      }
      if (s.oauth_tiktok_enabled === '1') {
        document.getElementById('btn-tiktok').style.display = 'inline-flex';
        any = true;
      }
      if (any) {
        document.getElementById('social-login').style.display = 'flex';
        document.getElementById('social-divider').style.display = 'flex';
      }
    }).catch(() => {});

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fb = document.getElementById('login-feedback');
      const data = Object.fromEntries(new FormData(e.target).entries());
      fb.textContent = 'Signing in...';
      fb.className = 'form-feedback';
      try {
        const r = await fetch('api/auth.php?action=login', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const j = await r.json();
        if (j.success) {
          fb.textContent = '✨ Signed in! Redirecting…';
          fb.className = 'form-feedback success';
          const redirect = new URLSearchParams(location.search).get('redirect') || '/account.html';
          setTimeout(() => window.location.href = redirect, 600);
        } else if (j.code === 'EMAIL_NOT_VERIFIED') {
          // 未验证邮箱 — 显示重发链接
          fb.innerHTML = '⚠ ' + (j.error || 'Email not verified yet.') +
            '<br><a href="#" id="resend-verify-link" style="color:var(--gold);text-decoration:underline;">Resend verification email</a>';
          fb.className = 'form-feedback error';
          document.getElementById('resend-verify-link').addEventListener('click', async (ev) => {
            ev.preventDefault();
            ev.target.textContent = 'Sending…';
            try {
              const rr = await fetch('api/auth.php?action=resend-verify', {
                method: 'POST', credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: j.email || data.email }),
              });
              const jj = await rr.json();
              ev.target.textContent = jj.success ? '✓ Sent — check your inbox' : '✗ ' + (jj.error || 'Failed');
              ev.target.style.color = jj.success ? 'var(--success,#2c9)' : 'var(--error)';
            } catch (e) {
              ev.target.textContent = '✗ Network error';
              ev.target.style.color = 'var(--error)';
            }
          });
        } else {
          fb.textContent = j.error || 'Sign in failed';
          fb.className = 'form-feedback error';
        }
      } catch (err) {
        fb.textContent = 'Network error';
        fb.className = 'form-feedback error';
      }
    });
  </script>
</body>
