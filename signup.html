<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="brand">
        <img src="images/logo.png?v=DEPLOYHASH" alt="GlamEye" class="brand-logo" width="160" height="36" />
      </a>
      <nav class="site-nav"><a href="/">Back to Shop</a></nav>
    </div>
  </header>
  <main class="container" style="padding: 4rem 1rem;">
    <div class="form-card">
      <h1>Join GlamEye</h1>
      <p class="subtitle">Get 10% off your first order ✨</p>
      <p id="oauth-error" class="form-feedback error" style="display:none;"></p>
      <div id="social-login" class="form-group" style="display:none; flex-direction:column; margin-bottom:1.5rem; gap:.85rem;">
        <a href="api/oauth/google.php" id="btn-google" class="oauth-btn oauth-btn-google" style="display:none;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
            <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
            <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
          </svg>
          <span>Sign up with Google</span>
        </a>
        <a href="api/oauth/tiktok.php" id="btn-tiktok" class="oauth-btn oauth-btn-tiktok" style="display:none;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
            <path fill="#25F4EE" d="M19.59 9.39v4.91A14.18 14.18 0 0 0 27 16.05v4.93a18.97 18.97 0 0 1-7.41-1.62v10.31A8.33 8.33 0 1 1 11.26 21.34v5.05a3.28 3.28 0 1 0 3.28 3.28V9.39z"/>
            <path fill="#FE2C55" d="M22.59 6.39v4.91A14.18 14.18 0 0 0 30 13.05v4.93a18.97 18.97 0 0 1-7.41-1.62v10.31A8.33 8.33 0 1 1 14.26 18.34v5.05a3.28 3.28 0 1 0 3.28 3.28V6.39z"/>
            <path fill="#FFF" d="M20.59 7.89v4.91A14.18 14.18 0 0 0 28 14.55v4.93a18.97 18.97 0 0 1-7.41-1.62v10.31A8.33 8.33 0 1 1 12.26 19.84v5.05a3.28 3.28 0 1 0 3.28 3.28V7.89z"/>
          </svg>
          <span>Sign up with TikTok</span>
        </a>
      </div>
      <div id="social-divider" class="divider" style="display:none;">OR</div>
      <form id="signup-form" class="form-group">
        <div class="form-row">
          <label>
            <span class="label-text">First Name</span>
            <input type="text" name="first_name" required maxlength="100" autocomplete="given-name" />
          </label>
          <label>
            <span class="label-text">Last Name</span>
            <input type="text" name="last_name" maxlength="100" autocomplete="family-name" />
          </label>
        </div>
        <label>
          <span class="label-text">Email</span>
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <label>
          <span class="label-text">Password (min 8 characters)</span>
          <input type="password" name="password" required minlength="8" autocomplete="new-password" />
        </label>
        <div class="checkbox-row">
          <input type="checkbox" name="is_subscribed" id="sub" value="1" checked />
          <label for="sub">Send me beauty tips, new launches & exclusive 10% off code</label>
        </div>
        <button type="submit" class="button button-primary button-block">Create Account</button>
        <p id="signup-feedback" class="form-feedback"></p>
      </form>
      <div class="divider">OR</div>
      <p class="text-center muted small">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </main>
  <script src="js/app.js?v=DEPLOYHASH"></script>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('error')) {
      const eEl = document.getElementById('oauth-error');
      eEl.textContent = '⚠ ' + params.get('error');
      eEl.style.display = 'block';
    }
    fetch('api/settings.php').then(r => r.json()).then(s => {
      let any = false;
      if (s.oauth_google_enabled === '1') {
        document.getElementById('btn-google').style.display = 'inline-flex'; any = true;
      }
      if (s.oauth_tiktok_enabled === '1') {
        document.getElementById('btn-tiktok').style.display = 'inline-flex'; any = true;
      }
      if (any) {
        document.getElementById('social-login').style.display = 'flex';
        document.getElementById('social-divider').style.display = 'flex';
      }
    }).catch(() => {});

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fb = document.getElementById('signup-feedback');
      const data = Object.fromEntries(new FormData(e.target).entries());
      data.is_subscribed = data.is_subscribed ? 1 : 0;
      fb.textContent = 'Creating account...';
      fb.className = 'form-feedback';
      try {
        const r = await fetch('api/auth.php?action=signup', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const j = await r.json();
        if (j.success && j.requires_verification) {
          // 强制邮箱验证模式 — 不自动登录,显示"去 inbox"卡片
          const card = document.querySelector('.form-card');
          if (card) {
            const safeEmail = String(j.email || '').replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
            card.innerHTML = `
              <div style="text-align:center;padding:1rem 0;">
                <div style="font-size:3rem;margin-bottom:1rem;">📧</div>
                <h2 style="font-family:var(--serif);font-size:1.6rem;margin-bottom:.75rem;color:var(--cream);">Check your inbox</h2>
                <p style="color:var(--text);line-height:1.7;margin-bottom:1.5rem;">
                  We've sent a verification link to <strong style="color:var(--gold);">${safeEmail}</strong>.<br>
                  Click the link to activate your account, then come back to sign in.
                </p>
                ${j.email_sent ? '' : '<p style="color:var(--warn,#d49f3a);font-size:.9rem;margin-bottom:1rem;">⚠ The verification email failed to send automatically. Use "Resend verification email" on the sign-in page.</p>'}
                <p class="muted small" style="margin-bottom:1.5rem;">Didn't receive it? Check your spam folder, or use "Resend verification email" on the login page.</p>
                <a href="/login.html" class="button button-primary" style="display:inline-block;">Go to sign in →</a>
              </div>
            `;
          }
          return;
        }
        if (j.success) {
          // 没强制验证(toggle 关了):正常跳 account
          fb.textContent = '✨ Welcome! Redirecting…';
          fb.className = 'form-feedback success';
          const redirect = new URLSearchParams(location.search).get('redirect') || '/account.html';
          setTimeout(() => window.location.href = redirect, 600);
        } else {
          fb.textContent = j.error || 'Sign up failed';
          fb.className = 'form-feedback error';
        }
      } catch (err) {
        fb.textContent = 'Network error';
        fb.className = 'form-feedback error';
      }
    });
  </script>
</body>
